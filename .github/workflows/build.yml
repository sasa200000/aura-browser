name: Build Aura Browser APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the Android SDK at
      # /usr/local/lib/android/sdk. android-actions/setup-android tries to install
      # the retired 'tools' package and fails the job, so pin the SDK paths directly.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # sdkmanager lives under cmdline-tools/<version> on the runner image
          SM_DIR=$(dirname "$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)")
          [ -n "$SM_DIR" ] && echo "$SM_DIR" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK"

      - name: Install platform 36 and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager --list_installed | head -20

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
